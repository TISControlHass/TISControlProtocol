<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />

    <style type="text/tailwindcss">
      @theme {
        --color-body: var(--body-bg);
        --color-card: var(--card-bg);
        --color-text-color: var(--text-color);
        --color-input: var(--input-bg);
        --color-input-border: var(--input-border);

        --color-primary: var(--btn-primary);
        --color-primary-hover: var(--btn-primary-hover);
        --color-success: var(--btn-success);
        --color-success-hover: var(--btn-success-hover);
        --color-danger: var(--btn-danger);
        --color-danger-hover: var(--btn-danger-hover);

        --shadow-theme: var(--box-shadow);
      }

      :root {
        --body-bg: #f8f9fa;
        --card-bg: #fff;
        --text-color: #474d53;
        --input-bg: #fff;
        --input-border: #ced4da;
        --btn-primary: #4e73df;
        --btn-primary-hover: #3a5fc4;
        --btn-success: #28a745;
        --btn-success-hover: #218838;
        --btn-danger: #dc3545;
        --btn-danger-hover: #c82333;
        --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      [data-theme="dark"] {
        --body-bg: #1a1d21;
        --card-bg: #2d343c;
        --text-color: #e9ecef;
        --input-bg: #343a40;
        --input-border: #495057;
        --btn-primary: #4e73df;
        --btn-primary-hover: #5a7ae2;
        --btn-success: #28a745;
        --btn-success-hover: #34ce57;
        --btn-danger: #dc3545;
        --btn-danger-hover: #e4606d;
        --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }

      .theme-btn.active {
        background-color: var(--btn-primary) !important;
        color: white !important;
        border-color: var(--btn-primary) !important;
      }
    </style>
  </head>

  <body class="bg-body text-text-color transition-all duration-300">
    <div class="bg-card py-5 shadow-theme">
      <div class="container mx-auto">
        <div class="flex flex-row items-center justify-between px-5 md:px-0">
          <div class="text-2xl font-bold">Passwords Dashboard</div>

          <div id="theme-buttons" class="flex flex-row space-x-4">
            <button
              class="theme-btn outline-1 outline-input-border px-3 py-3 rounded bg-white text-[#474d53] cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:drop-shadow-lg"
              data-theme="light"
            >
              <i class="fas fa-sun px-2"></i> Light
            </button>
            <button
              class="theme-btn outline-1 outline-input-border px-3 py-3 rounded text-white bg-gray-800 cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:drop-shadow-lg"
              data-theme="dark"
            >
              <i class="fas fa-moon px-2"></i> Dark
            </button>
            <button
              class="theme-btn outline-1 outline-input-border px-3 py-3 rounded bg-card cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:drop-shadow-lg"
              data-theme="system"
            >
              <i class="fas fa-laptop px-2"></i> System
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="container mx-auto w-full h-[calc(100vh-100px)] flex items-center justify-center"
    >
      <div class="rounded-3xl bg-card w-11/12 md:w-4xl lg:w-5xl shadow-theme">
        <div class="font-bold text-2xl w-full border-input-border border-b">
          <p class="px-8 py-5">Your Passwords</p>
        </div>

        <div class="flex flex-col items-center px-8 py-10">
          <button
            class="bg-primary text-white rounded-xl px-5 py-3 font-bold text-lg transition-all duration-300 cursor-pointer hover:bg-primary-hover hover:-translate-y-1 hover:drop-shadow-xl"
          >
            <i class="fas fa-add px-2"></i> Add new password
          </button>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const themeButtons = document.querySelectorAll(".theme-btn");

        function applyTheme(theme) {
          // 1. Handle logic for System vs Explicit
          if (theme === "system") {
            const prefersDark = window.matchMedia(
              "(prefers-color-scheme: dark)"
            ).matches;
            document.documentElement.setAttribute(
              "data-theme",
              prefersDark ? "dark" : "light"
            );
          } else {
            document.documentElement.setAttribute("data-theme", theme);
          }

          // 2. Handle Visual Active State
          themeButtons.forEach((button) => {
            if (button.dataset.theme === theme) {
              button.classList.add("active");
            } else {
              button.classList.remove("active");
            }
          });

          // 3. Save Preference
          localStorage.setItem("theme", theme);
        }

        // Event Listeners
        themeButtons.forEach((button) => {
          button.addEventListener("click", () => {
            const theme = button.dataset.theme;
            applyTheme(theme);
          });
        });

        // Initialize on Load
        // Check localStorage, if empty default to 'system'
        const savedTheme = localStorage.getItem("theme") || "system";
        applyTheme(savedTheme);
      });
    </script>
  </body>
</html>
