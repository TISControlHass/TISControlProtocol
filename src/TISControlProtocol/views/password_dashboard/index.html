<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />

    <style type="text/tailwindcss">
      @theme {
        --color-body: var(--body-bg);
        --color-card: var(--card-bg);
        --color-text-color: var(--text-color);
        --color-input: var(--input-bg);
        --color-input-border: var(--input-border);

        --color-primary: var(--btn-primary);
        --color-primary-hover: var(--btn-primary-hover);
        --color-success: var(--btn-success);
        --color-success-hover: var(--btn-success-hover);
        --color-danger: var(--btn-danger);
        --color-danger-hover: var(--btn-danger-hover);

        --shadow-theme: var(--box-shadow);
      }

      :root {
        --body-bg: #eaeaeb;
        --card-bg: #fff;
        --text-color: #474d53;
        --input-bg: #fff;
        --input-border: #ced4da;
        --btn-primary: #4e73df;
        --btn-primary-hover: #3a5fc4;
        --btn-success: #28a745;
        --btn-success-hover: #218838;
        --btn-danger: #dc3545;
        --btn-danger-hover: #c82333;
        --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      [data-theme="dark"] {
        --body-bg: #1a1d21;
        --card-bg: #2d343c;
        --text-color: #e9ecef;
        --input-bg: #343a40;
        --input-border: #495057;
        --btn-primary: #4e73df;
        --btn-primary-hover: #5a7ae2;
        --btn-success: #28a745;
        --btn-success-hover: #34ce57;
        --btn-danger: #dc3545;
        --btn-danger-hover: #e4606d;
        --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }

      .theme-btn.active {
        background-color: var(--btn-primary) !important;
        color: white !important;
        border-color: var(--btn-primary) !important;
      }
    </style>
  </head>

  <body class="bg-body text-text-color transition-all duration-300">
    <div class="bg-card py-5 shadow-theme">
      <div class="container mx-auto">
        <div class="flex flex-row items-center justify-between px-5 md:px-0">
          <div class="text-2xl font-bold">Passwords Dashboard</div>

          <div id="theme-buttons" class="flex flex-row space-x-4">
            <button
              class="theme-btn outline-1 outline-input-border px-3 py-3 rounded bg-white text-[#474d53] cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:drop-shadow-lg"
              data-theme="light"
            >
              <i class="fas fa-sun px-2"></i> Light
            </button>
            <button
              class="theme-btn outline-1 outline-input-border px-3 py-3 rounded text-white bg-gray-800 cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:drop-shadow-lg"
              data-theme="dark"
            >
              <i class="fas fa-moon px-2"></i> Dark
            </button>
            <button
              class="theme-btn outline-1 outline-input-border px-3 py-3 rounded bg-card cursor-pointer transition-all duration-300 hover:-translate-y-1 hover:drop-shadow-lg"
              data-theme="system"
            >
              <i class="fas fa-laptop px-2"></i> System
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="container mx-auto w-full h-[calc(100vh-100px)] flex items-center justify-center"
    >
      <div class="rounded-3xl bg-card w-11/12 md:w-4xl lg:w-5xl shadow-theme">
        <div class="font-bold text-2xl w-full border-input-border border-b">
          <p class="px-8 py-5">Your Passwords</p>
        </div>

        <form
          class="passwords-form flex flex-col items-center px-8 py-10 space-y-5"
        >
          <div
            data-index="0"
            class="password-entity rounded-2xl px-5 py-3 w-full border border-input-border border-l-4 border-l-primary bg-input space-y-3 transitions-all duration-300 hover:shadow-md hover:shadow-body"
          >
            <div
              class="flex flex-row w-full items-center justify-between py-2 px-2"
            >
              <div
                class="flex items-center justify-center rounded-[100%] bg-primary w-10 h-10 font-bold text-white"
              >
                1
              </div>

              <button
                title="Remove Password"
                class="bg-danger text-white rounded-[100%] w-10 h-10 font-bold transition-all duration-300 cursor-pointer hover:bg-danger-hover hover:-translate-y-0.5 hover:drop-shadow-xl"
              >
                <i class="fas fa-trash px-2"></i>
              </button>
            </div>
            <div class="flex flex-row items-center space-x-5 px-3 py-3">
              <div
                class="flex-1 flex-col items-start justify-center space-y-1 w-full"
              >
                <label class="font-bold text-lg" for="title_0">Title:</label>
                <input
                  required
                  type="text"
                  name="titles[]"
                  id="title_0"
                  class="border border-input-border bg-input rounded-lg px-5 py-2 w-full focus:outline focus:outline-primary min-h-12"
                  placeholder="Type the title..."
                />
              </div>

              <div
                class="flex-1 flex-col items-start justify-center space-y-1 w-full"
              >
                <label class="font-bold text-lg" for="password_0"
                  >Password:</label
                >
                <input
                  type="password"
                  name="passwords[]"
                  id="password_0"
                  class="border border-input-border bg-input rounded-lg px-5 py-2 w-full focus:outline focus:outline-primary min-h-12"
                  placeholder="Type the password..."
                  required
                />
              </div>
            </div>

            <div
              class="flex flex-row items-center space-x-5 pb-3 justify-center"
            >
              <button
                id="regenerate_password_0"
                class="bg-primary text-white rounded-xl px-5 py-3 font-bold text-sm md:text-md lg:text-lg transition-all duration-300 cursor-pointer hover:bg-primary-hover hover:-translate-y-1 hover:drop-shadow-xl"
              >
                <i class="fas fa-rotate px-2"></i> Regenerate Password
              </button>
              <button
                id="copy_password_0"
                class="bg-card rounded-xl outline outline-primary text-primary px-5 py-3 font-bold text-sm md:text-md lg:text-lg transition-all duration-300 cursor-pointer hover:-translate-y-1 hover:bg-primary hover:outline-none hover:text-white"
              >
                <i class="fas fa-copy px-2"></i> Copy Password
              </button>
            </div>
          </div>

          <!-- Add New Password Button -->
          <button
            id="add_new_password"
            class="bg-success text-white rounded-xl px-5 py-3 font-bold text-lg transition-all duration-300 cursor-pointer hover:bg-success-hover hover:-translate-y-1 hover:drop-shadow-xl"
          >
            <i class="fas fa-add pr-2"></i> Add New Password
          </button>

          <div class="w-full border-b border-input-border"></div>

          <div class="submit-container flex flex-row items-center space-x-8">
            <button
              type="submit"
              class="bg-primary text-white rounded-xl px-5 py-3 font-bold text-md lg:text-lg transition-all duration-300 cursor-pointer hover:bg-primary-hover hover:-translate-y-1 hover:drop-shadow-xl"
            >
              <i class="fas fa-save pr-2"></i> Save Passwords
            </button>
            <a
              href="http://homeassistant.local:8123"
              class="bg-card rounded-xl outline outline-primary text-primary px-5 py-3 font-bold transition-all duration-300 cursor-pointer hover:-translate-y-1 hover:bg-primary hover:outline-none hover:text-white"
            >
              <i class="fas fa-ban pr-2"></i> Cancel
            </a>
          </div>
        </form>
      </div>
    </div>

    <script>
      // <!-- Theme Stuff -->
      document.addEventListener("DOMContentLoaded", function () {
        const themeButtons = document.querySelectorAll(".theme-btn");

        function applyTheme(theme) {
          // 1. Handle logic for System vs Explicit
          if (theme === "system") {
            const prefersDark = window.matchMedia(
              "(prefers-color-scheme: dark)"
            ).matches;
            document.documentElement.setAttribute(
              "data-theme",
              prefersDark ? "dark" : "light"
            );
          } else {
            document.documentElement.setAttribute("data-theme", theme);
          }

          // 2. Handle Visual Active State
          themeButtons.forEach((button) => {
            if (button.dataset.theme === theme) {
              button.classList.add("active");
            } else {
              button.classList.remove("active");
            }
          });

          // 3. Save Preference
          localStorage.setItem("theme", theme);
        }

        // Event Listeners
        themeButtons.forEach((button) => {
          button.addEventListener("click", () => {
            const theme = button.dataset.theme;
            applyTheme(theme);
          });
        });

        // Initialize on Load
        // Check localStorage, if empty default to 'system'
        const savedTheme = localStorage.getItem("theme") || "system";
        applyTheme(savedTheme);

        // ----------------------------------------
        // <!-- Password Entities Stuff -->
      });
    </script>
  </body>
</html>
