<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Password Form</title>
  </head>
  <body class="text-white flex flex-col items-center justify-center h-screen">
    <div class="w-50 h-50">
      <img
        src="https://www.tiscontrol.com/tp_Public/Home/img/logo.png"
        alt="Tis Logo"
      />
    </div>
    <div
      class="bg-slate-900 p-8 rounded-lg shadow-xl border border-slate-700 max-w-lg w-full"
    >
      <form action="" class="flex flex-col space-y-5">
        <h1 class="text-2xl text-center font-bold">Password Form</h1>

        <input
          type="password"
          class="w-full border-2 border-slate-700 rounded-2xl min-h-12 px-5 outline-none focus:border-red-600 transition-colors"
          placeholder="Enter Password..."
        />

        <button
          onclick="console.log('I have been clicked')"
          class="mx-auto bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-xl transition duration-200 cursor-pointer"
        >
          Submit
        </button>
      </form>
    </div>
  </body>
</html>
